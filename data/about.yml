paragraphs:
  - "I was born in 1980 (long time ago) in [Drăgășani](https://www.google.com/maps/search/?api=1&query=Dragasani,+Valcea,+Romania), Vâlcea, Oltenia, Romania. First years I spent going to nursery school, kindergarten and playing. Then when I was almost 8 they sent me to school. I did my primary, secondary and High School in my home town."
  - "On September 2000 I moved to Bucharest to study [Physics at University of Bucharest](https://fizica.unibuc.ro/). On June 2004 I graduated, on August 2004 I moved to Belfast to do my PhD and on February 2009 I moved to Dublin. For more read my CV."
  - "I have studied for a PhD at Queen’s University Belfast in the Atomistic Simulation Centre. My supervisors were Prof Tony Paxton and Dr Tchavdar Todorov. My thesis topic was Time Dependent Tight Binding+U: Applications to fluorescent molecules (never submitted)."
  - "I was employed by [Irish Centre for High-End Computing (ICHEC)](https://www.ichec.ie/) in the Dublin Offices as Computational Scientist. I got my PhD in School of Physics, at [University College Dublin](https://www.ucd.ie/) with Professor Giovanni Ciccotti and Dr Simone Meloni, and continued at [ICHEC](https://www.ichec.ie/) as Computational Scientist."
  - "Currently I am employed by Science and Technology Facilities Council (STFC) in [Scientific Computing Department](https://www.sc.stfc.ac.uk/) based at Daresbury Laboratory as Computational Scientist and group leader for [Data Driven Materials and Molecular Science](https://ddmms.elena.re)"
