research:
  enable: true
  title: "Research"
  subtitle: "Data Driven Materials and Molecular Science (DDMMS)"
  description: "My research at STFC Daresbury Laboratory leads the Data Driven Materials and Molecular Science group, focusing on physics-informed machine learning, atomistic simulation software at scale, and multiscale materials modelling."
  primary_link:
    label: "Explore Research on DDMMS"
    url: "https://ddmms.elena.re/research.html"
    icon: "bi-box-arrow-up-right"
  profile_link:
    label: "Dr. Alin Marin Elena @ DDMMS"
    url: "https://ddmms.elena.re/alin-marin-elena.html"
    icon: "bi-person-workspace"
  highlights:
    - title: "Foundation Machine-Learned Interatomic Potentials"
      icon: "bi-diagram-3"
      description: "Developing and validating equivariant foundation force fields (MACE, MACE-POLAR), active learning strategies, fine-tuning protocols, and cross-learning across electronic structure theories."
      link: "https://ddmms.elena.re/research.html"
    - title: "Complex Liquids, Molten Salts & Porous Materials"
      icon: "bi-droplet-half"
      description: "Investigating transport properties, viscosity bounds, and thermal conductivity in molten salts and complex liquids, as well as phonons and nanoconfinement in Metal-Organic Frameworks (MOFs)."
      link: "https://ddmms.elena.re/research.html"
    - title: "Atomistic Workflows & Exascale Simulation"
      icon: "bi-hdd-network"
      description: "Architecting open-source scientific software and automated workflows including janus-core and DL_POLY 5 for large-scale molecular dynamics and reproducible materials discovery."
      link: "https://ddmms.elena.re/alin-marin-elena.html"

