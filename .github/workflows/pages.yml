name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML Data Files
        run: |
          python3 -c '
          import glob, sys, yaml
          files = sorted(glob.glob("data/*.yml") + glob.glob("data/*.yaml"))
          assert files, "No YAML files found in data/"
          for f in files:
              with open(f, "r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"Validated {f}")
          '

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets data images _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
