<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alin M Elena</title>
  <meta name="description" content="Dr. Alin Marin Elena — Principal Computational Scientist &amp; Group Leader, Data Driven Materials and Molecular Science at STFC Daresbury Laboratory.">
  <meta name="author" content="Alin M Elena">

  <!-- Favicons -->
  <link rel="shortcut icon" href="images/favicon.png" type="image/png">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="images/site.webmanifest">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anaheim&family=Cabin+Sketch:wght@700&family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Permanent+Marker&family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400&family=Rock+Salt&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Dark Theme Styles -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Theme Initializer (prevents flash of default theme) -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem("mlego-theme") || localStorage.getItem("site-theme") || "default";
        document.documentElement.setAttribute("data-theme", savedTheme);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Floating Corner Navigation & Theme Menu -->
  <nav class="corner-nav-wrapper" aria-label="Site navigation and theme controls">
    <div class="corner-nav-btn-group">
      <button
        type="button"
        id="corner-theme-toggle"
        class="corner-theme-btn"
        aria-expanded="false"
        aria-controls="corner-theme-panel"
        aria-label="Choose color theme"
        title="Choose color theme"
      >
        <i class="bi bi-palette-fill"></i>
      </button>
      <button
        type="button"
        id="corner-menu-toggle"
        class="corner-menu-btn"
        aria-expanded="false"
        aria-controls="corner-menu-panel"
        aria-label="Toggle navigation menu"
      >
        <img id="corner-btn-logo" src="images/logo.png" alt="Logo" class="brand-avatar">
        <span id="corner-current-section">Menu</span>
        <span class="menu-icon-bars" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>

    <!-- Theme Selection Panel -->
    <div id="corner-theme-panel" class="corner-theme-panel" role="dialog" aria-label="Color theme selector">
      <div class="d-flex align-items-center justify-content-between px-2 pb-2 mb-2 border-bottom border-secondary border-opacity-25">
        <span class="fw-bold text-white small text-uppercase" style="letter-spacing: 0.06em;"><i class="bi bi-palette me-1 text-info"></i> Color Theme</span>
        <span class="badge bg-dark text-info border border-info border-opacity-25" id="theme-active-name">Cyber Cyan</span>
      </div>
      <div class="theme-options-grid">
        <button type="button" class="theme-option-btn active" data-theme-id="default" title="Cyber Cyan: Modern cyan and emerald cyber aesthetic">
          <span class="theme-swatch" style="--swatch-1: #57cbcc; --swatch-2: #6cb670; --swatch-bg: #0f1318;"></span>
          <span class="theme-name">Cyber Cyan</span>
          <i class="bi bi-check2 theme-check-icon"></i>
        </button>
        <button type="button" class="theme-option-btn" data-theme-id="nord" title="Nord Frost: Arctic ice and polar aurora night">
          <span class="theme-swatch" style="--swatch-1: #88c0d0; --swatch-2: #a3be8c; --swatch-bg: #242933;"></span>
          <span class="theme-name">Nord Frost</span>
          <i class="bi bi-check2 theme-check-icon"></i>
        </button>
        <button type="button" class="theme-option-btn" data-theme-id="dracula" title="Dracula: Vampire purple and neon electric pink">
          <span class="theme-swatch" style="--swatch-1: #bd93f9; --swatch-2: #ff79c6; --swatch-bg: #21222c;"></span>
          <span class="theme-name">Dracula</span>
          <i class="bi bi-check2 theme-check-icon"></i>
        </button>
        <button type="button" class="theme-option-btn" data-theme-id="monokai" title="Monokai Pro: Vibrant warm amber and magenta neon">
          <span class="theme-swatch" style="--swatch-1: #ffd866; --swatch-2: #ff6188; --swatch-bg: #19181a;"></span>
          <span class="theme-name">Monokai Pro</span>
          <i class="bi bi-check2 theme-check-icon"></i>
        </button>
        <button type="button" class="theme-option-btn" data-theme-id="gruvbox" title="Gruvbox Retro: Vintage warm amber, orange and retro forest">
          <span class="theme-swatch" style="--swatch-1: #fabd2f; --swatch-2: #8ec07c; --swatch-bg: #1d2021;"></span>
          <span class="theme-name">Gruvbox Retro</span>
          <i class="bi bi-check2 theme-check-icon"></i>
        </button>
        <button type="button" class="theme-option-btn" data-theme-id="catppuccin" title="Catppuccin Mocha: Velvet mauve, flamingo and sapphire">
          <span class="theme-swatch" style="--swatch-1: #cba6f7; --swatch-2: #f5c2e7; --swatch-bg: #11111b;"></span>
          <span class="theme-name">Catppuccin</span>
          <i class="bi bi-check2 theme-check-icon"></i>
        </button>
        <button type="button" class="theme-option-btn" data-theme-id="solarized" title="Solarized Dark: Deep teal ocean, cyan and solar amber">
          <span class="theme-swatch" style="--swatch-1: #2aa198; --swatch-2: #cb4b16; --swatch-bg: #00212b;"></span>
          <span class="theme-name">Solarized</span>
          <i class="bi bi-check2 theme-check-icon"></i>
        </button>
      </div>
    </div>

    <!-- Main Navigation Panel -->
    <div id="corner-menu-panel" class="corner-menu-panel" role="menu">
      <div class="d-flex align-items-center justify-content-between px-2 pb-2 mb-2 border-bottom border-secondary border-opacity-25">
        <span class="fw-bold text-white small text-uppercase" style="letter-spacing: 0.06em;">Navigation</span>
        <span class="badge bg-dark text-info border border-info border-opacity-25">alin.elena.re</span>
      </div>
      <ul id="corner-nav-list" class="corner-nav-list"></ul>

      <!-- Theme Selector inside Menu -->
      <div class="border-top border-secondary border-opacity-25 pt-2 mt-2">
        <div class="px-2 pb-2 d-flex align-items-center justify-content-between">
          <span class="small text-secondary text-uppercase fw-semibold" style="letter-spacing: 0.05em;"><i class="bi bi-palette me-1"></i> Color Theme</span>
        </div>
        <div class="d-flex flex-wrap gap-1 px-2 pb-1 theme-menu-swatches">
          <button type="button" class="theme-swatch-pill active" data-theme-id="default" title="Cyber Cyan" style="--pill-accent: #57cbcc;">
            <span class="dot"></span> Cyber
          </button>
          <button type="button" class="theme-swatch-pill" data-theme-id="nord" title="Nord Frost" style="--pill-accent: #88c0d0;">
            <span class="dot"></span> Nord
          </button>
          <button type="button" class="theme-swatch-pill" data-theme-id="dracula" title="Dracula" style="--pill-accent: #bd93f9;">
            <span class="dot"></span> Dracula
          </button>
          <button type="button" class="theme-swatch-pill" data-theme-id="monokai" title="Monokai Pro" style="--pill-accent: #ffd866;">
            <span class="dot"></span> Monokai
          </button>
          <button type="button" class="theme-swatch-pill" data-theme-id="gruvbox" title="Gruvbox Retro" style="--pill-accent: #fabd2f;">
            <span class="dot"></span> Gruvbox
          </button>
          <button type="button" class="theme-swatch-pill" data-theme-id="catppuccin" title="Catppuccin Mocha" style="--pill-accent: #cba6f7;">
            <span class="dot"></span> Mocha
          </button>
          <button type="button" class="theme-swatch-pill" data-theme-id="solarized" title="Solarized Dark" style="--pill-accent: #2aa198;">
            <span class="dot"></span> Solarized
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero / Landing Section -->
  <header>
    <section id="hero" class="hero-section parallax-window" data-parallax-speed="0.42">
      <div class="parallax-bg" id="hero-parallax-bg" style="background-image: url('images/backgrounds/exterior-stone-wall.webp');"></div>
      <div id="hero-content" class="hero-content container">
        <div class="hero-pulse-badge">
          <img src="images/logo.png" alt="Alin Marin Elena">
        </div>
        <h1 class="hero-title">Alin Marin Elena</h1>
        <p class="hero-subtitle">Computational Scientist <span class="hero-bullet">•</span> Materials &amp; Molecular Modelling</p>
        <div class="hero-scroll-wrapper">
          <a href="#about" class="scroll-down-btn" aria-label="Scroll down to About section" title="Scroll down">
            <i class="bi bi-chevron-double-down"></i>
          </a>
        </div>
      </div>
    </section>
  </header>

  <main>
    <!-- About Section -->
    <section id="about" class="section-block reveal-section">
      <div id="about-container" class="container"></div>
    </section>

    <div class="parallax-band parallax-window" data-divider="after_about" data-parallax-speed="0.38">
      <div class="parallax-bg"></div>
    </div>

    <!-- CV Section (Vertical Linear Timeline: Employment & Education) -->
    <section id="cv" class="section-block section-bg-alt reveal-section">
      <div id="cv-container" class="container"></div>
    </section>

    <div class="parallax-band parallax-window" data-divider="after_cv" data-parallax-speed="0.38">
      <div class="parallax-bg"></div>
    </div>

    <!-- Research Section (Links to ddmms.elena.re) -->
    <section id="research" class="section-block reveal-section">
      <div id="research-container" class="container"></div>
    </section>

    <div class="parallax-band parallax-window" data-divider="after_research" data-parallax-speed="0.38">
      <div class="parallax-bg"></div>
    </div>

    <!-- Publications Section (Links to ddmms.elena.re) -->
    <section id="publications" class="section-block section-bg-alt reveal-section">
      <div id="publications-container" class="container"></div>
    </section>

    <div class="parallax-band parallax-window" data-divider="after_publications" data-parallax-speed="0.38">
      <div class="parallax-bg"></div>
    </div>

    <!-- Hobbies Section -->
    <section id="hobbies" class="section-block reveal-section">
      <div id="hobbies-container" class="container"></div>
    </section>

    <div class="parallax-band parallax-window" data-divider="after_hobbies" data-parallax-speed="0.38">
      <div class="parallax-bg"></div>
    </div>

    <!-- Blog / Posts Section -->
    <section id="posts" class="section-block section-bg-alt reveal-section">
      <div id="posts-container" class="container"></div>
    </section>

    <div class="parallax-band parallax-window" data-divider="after_posts" data-parallax-speed="0.38">
      <div class="parallax-bg"></div>
    </div>

    <!-- Contact Section -->
    <section id="contact" class="section-block section-bg-alt reveal-section">
      <div id="contact-container" class="container"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="py-5 border-top border-secondary border-opacity-25 text-center" style="background-color: #0b0e12;">
    <div id="footer-container" class="container"></div>
  </footer>

  <!-- Post Reader Modal -->
  <div class="modal fade" id="postReaderModal" tabindex="-1" aria-labelledby="postModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="background-color: #161c24; border: 1px solid rgba(255,255,255,0.12);">
        <div class="modal-header border-secondary border-opacity-25">
          <div>
            <h2 class="modal-title h4 text-white mb-1" id="postModalTitle"></h2>
            <div id="postModalMeta" class="small text-muted"></div>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 text-light" id="postModalBody"></div>
        <div class="modal-footer border-secondary border-opacity-25">
          <button type="button" class="btn-ddmms-outline btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencies: Bootstrap 5 Bundle, js-yaml, marked -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Main Reactive YAML Renderer -->
  <script src="assets/js/app.js"></script>
</body>
</html>
